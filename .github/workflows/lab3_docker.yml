name: Lab3 Docker Build Push Test

on:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./lab3_deploy
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/wine_predict_2022bcs0016:v1

      - name: Pull and run (clean proof)
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/wine_predict_2022bcs0016:v1
          docker run -d -p 8000:8000 --name wineapi ${{ secrets.DOCKERHUB_USERNAME }}/wine_predict_2022bcs0016:v1
          sleep 5
          curl -X POST "http://127.0.0.1:8000/predict" \
            -H "Content-Type: application/json" \
            -d '{"fixed_acidity":7.4,"volatile_acidity":0.7,"citric_acid":0.0,"residual_sugar":1.9,"chlorides":0.076,"free_sulfur_dioxide":11,"total_sulfur_dioxide":34,"density":0.9978,"ph":3.51,"sulphates":0.56,"alcohol":9.4}'

name: Lab 8 - DVC + HF Source + S3-Compatible Remote
on:
  push:
    branches: [ main ]
    paths:
      - '.dvc/**'
      - 'data/housing.csv.dvc'
      - '.github/workflows/lab8_dvc.yml'
      - 'train_california.py'
      - 'california_api.py'
      - 'Dockerfile.california'
      - 'requirements_lab8.txt'
  workflow_dispatch:

env:
  ROLL_NO: "2022BCS0016"
  STUDENT_NAME: "Srinivas Raghav V C"
  BEST_R2_VARIABLE: "BEST_HOUSING_R2"
  BEST_RMSE_VARIABLE: "BEST_HOUSING_RMSE"

jobs:
  train-with-dvc:
    runs-on: [self-hosted, Windows, X64]
    outputs:
      current_r2: ${{ steps.metrics.outputs.current_r2 }}
      current_rmse: ${{ steps.metrics.outputs.current_rmse }}
      dataset_size: ${{ steps.metrics.outputs.dataset_size }}
      training_samples: ${{ steps.metrics.outputs.training_samples }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_lab8.txt

    - name: Pull Imported Dataset
      shell: pwsh
      run: |
        if (-not (Test-Path 'data/housing.csv.dvc')) {
          throw 'data/housing.csv.dvc is missing'
        }
        python -m dvc pull data/housing.csv.dvc

    - name: Train California Housing Model
      shell: pwsh
      run: |
        python train_california.py

    - name: Extract Metrics
      id: metrics
      shell: pwsh
      run: |
        $metrics = Get-Content 'app/artifacts/metrics.json' | ConvertFrom-Json
        Add-Content $env:GITHUB_OUTPUT "current_r2=$($metrics.r2_score)"
        Add-Content $env:GITHUB_OUTPUT "current_rmse=$($metrics.rmse)"
        Add-Content $env:GITHUB_OUTPUT "dataset_size=$($metrics.dataset_size)"
        Add-Content $env:GITHUB_OUTPUT "training_samples=$($metrics.training_samples)"

    - name: Upload Metrics Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lab8-metrics
        path: app/artifacts/

    - name: Summary
      shell: pwsh
      run: |
        Add-Content $env:GITHUB_STEP_SUMMARY '## Lab 8 Summary - 2022BCS0016'
        Add-Content $env:GITHUB_STEP_SUMMARY ''
        Add-Content $env:GITHUB_STEP_SUMMARY '**Student:** Srinivas Raghav V C'
        Add-Content $env:GITHUB_STEP_SUMMARY '**Roll No:** 2022BCS0016'
        Add-Content $env:GITHUB_STEP_SUMMARY ''
        Add-Content $env:GITHUB_STEP_SUMMARY '### Dataset Info'
        Add-Content $env:GITHUB_STEP_SUMMARY '- Dataset Rows: ${{ steps.metrics.outputs.dataset_size }}'
        Add-Content $env:GITHUB_STEP_SUMMARY '- Training Samples: ${{ steps.metrics.outputs.training_samples }}'
        Add-Content $env:GITHUB_STEP_SUMMARY '- Source: Hugging Face dataset tracked by DVC'
        Add-Content $env:GITHUB_STEP_SUMMARY ''
        Add-Content $env:GITHUB_STEP_SUMMARY '### Model Metrics'
        Add-Content $env:GITHUB_STEP_SUMMARY '- R2 Score: ${{ steps.metrics.outputs.current_r2 }}'
        Add-Content $env:GITHUB_STEP_SUMMARY '- RMSE: ${{ steps.metrics.outputs.current_rmse }}'

  deploy:
    needs: train-with-dvc
    runs-on: [self-hosted, Windows, X64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Metrics Artifact
      uses: actions/download-artifact@v4
      with:
        name: lab8-metrics
        path: app/artifacts/

    - name: Get Baseline Metrics
      id: baseline
      env:
        GH_TOKEN: ${{ secrets.GH_PAT }}
      shell: pwsh
      run: |
        $gh = 'C:\Program Files\GitHub CLI\gh.exe'
        $bestR2 = (& $gh variable get $env:BEST_R2_VARIABLE --repo '${{ github.repository }}' 2>$null)
        if (-not $bestR2) { $bestR2 = '-999999' }
        $bestRmse = (& $gh variable get $env:BEST_RMSE_VARIABLE --repo '${{ github.repository }}' 2>$null)
        if (-not $bestRmse) { $bestRmse = '999999999' }
        Add-Content $env:GITHUB_OUTPUT "best_r2=$bestR2"
        Add-Content $env:GITHUB_OUTPUT "best_rmse=$bestRmse"

    - name: Compare Metrics
      id: compare
      shell: pwsh
      run: |
        $currentR2 = [double]'${{ needs.train-with-dvc.outputs.current_r2 }}'
        $currentRmse = [double]'${{ needs.train-with-dvc.outputs.current_rmse }}'
        $bestR2 = [double]'${{ steps.baseline.outputs.best_r2 }}'
        $bestRmse = [double]'${{ steps.baseline.outputs.best_rmse }}'

        $deploy = ($currentR2 -gt $bestR2) -or (($currentR2 -eq $bestR2) -and ($currentRmse -lt $bestRmse))
        Add-Content $env:GITHUB_OUTPUT "deploy=$($deploy.ToString().ToLower())"

        Write-Host "Current R2: $currentR2"
        Write-Host "Current RMSE: $currentRmse"
        Write-Host "Best R2: $bestR2"
        Write-Host "Best RMSE: $bestRmse"
        if ($deploy) {
          Write-Host '2022BCS0016 ---- California housing metrics improved'
        } else {
          Write-Host '2022BCS0016 ---- California housing metrics did not improve'
        }

    - name: Login Build and Push California Image
      if: steps.compare.outputs.deploy == 'true'
      shell: pwsh
      run: |
        $imageBase = '${{ secrets.DOCKERHUB_USERNAME }}/california-housing-api'
        $dockerUser = '${{ secrets.DOCKERHUB_USERNAME }}'
        $dockerToken = '${{ secrets.DOCKERHUB_TOKEN }}'
        $repoPath = (wsl.exe wslpath -a "$PWD").Trim()

        wsl.exe bash -lc "printf '%s' '$dockerToken' | docker login -u '$dockerUser' --password-stdin"
        wsl.exe bash -lc "cd '$repoPath' && docker build -f Dockerfile.california -t '$imageBase:latest' -t '$imageBase:${{ github.run_number }}' ."
        wsl.exe bash -lc "docker push '$imageBase:latest'"
        wsl.exe bash -lc "docker push '$imageBase:${{ github.run_number }}'"

    - name: Update Baseline Variables
      if: steps.compare.outputs.deploy == 'true'
      env:
        GH_TOKEN: ${{ secrets.GH_PAT }}
      shell: pwsh
      run: |
        $gh = 'C:\Program Files\GitHub CLI\gh.exe'
        & $gh variable set $env:BEST_R2_VARIABLE --body '${{ needs.train-with-dvc.outputs.current_r2 }}' --repo '${{ github.repository }}'
        & $gh variable set $env:BEST_RMSE_VARIABLE --body '${{ needs.train-with-dvc.outputs.current_rmse }}' --repo '${{ github.repository }}'

    - name: Deployment Summary
      shell: pwsh
      run: |
        Add-Content $env:GITHUB_STEP_SUMMARY '## Lab 8 Deployment Decision - 2022BCS0016'
        Add-Content $env:GITHUB_STEP_SUMMARY '- Current R2: ${{ needs.train-with-dvc.outputs.current_r2 }}'
        Add-Content $env:GITHUB_STEP_SUMMARY '- Current RMSE: ${{ needs.train-with-dvc.outputs.current_rmse }}'
        Add-Content $env:GITHUB_STEP_SUMMARY '- Previous Best R2: ${{ steps.baseline.outputs.best_r2 }}'
        Add-Content $env:GITHUB_STEP_SUMMARY '- Previous Best RMSE: ${{ steps.baseline.outputs.best_rmse }}'
        Add-Content $env:GITHUB_STEP_SUMMARY '- Deployed: ${{ steps.compare.outputs.deploy }}'

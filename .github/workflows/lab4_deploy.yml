name: Lab 4 - CI/CD Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  variables: write

env:
  ROLL_NO: "2022BCS0016"
  STUDENT_NAME: "Srinivas Raghav V C"

jobs:
  train:
    runs-on: ubuntu-latest
    outputs:
      r2_score: ${{ steps.metrics.outputs.r2_score }}
      mse: ${{ steps.metrics.outputs.mse }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Train Model
      run: python train.py
    
    - name: Extract Metrics
      id: metrics
      run: |
        R2=$(cat app/artifacts/metrics.json | jq -r '.r2_score')
        MSE=$(cat app/artifacts/metrics.json | jq -r '.mse')
        echo "r2_score=$R2" >> $GITHUB_OUTPUT
        echo "mse=$MSE" >> $GITHUB_OUTPUT
        echo "Roll No: $ROLL_NO - R2 Score: $R2, MSE: $MSE"
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: model-artifacts
        path: app/artifacts/
  
  deploy:
    needs: train
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        name: model-artifacts
        path: app/artifacts/
    
    - name: Get Current Metrics
      id: current
      run: |
        R2=$(cat app/artifacts/metrics.json | jq -r '.r2_score')
        echo "current_r2=$R2" >> $GITHUB_OUTPUT
    
    - name: Get Best R2 Score
      id: best
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        BEST=$(gh variable get BEST_R2_SCORE --repo ${{ github.repository }} 2>/dev/null || echo "0.0")
        echo "best_r2=$BEST" >> $GITHUB_OUTPUT
        echo "Best R2 Score from variable: $BEST"
    
    - name: Compare Metrics
      id: compare
      run: |
        CURRENT=${{ steps.current.outputs.current_r2 }}
        BEST=${{ steps.best.outputs.best_r2 }}
        echo "Current R2: $CURRENT"
        echo "Best R2: $BEST"
        
        if (( $(echo "$CURRENT > $BEST" | bc -l) )); then
          echo "deploy=true" >> $GITHUB_OUTPUT
          echo "2022BCS0016 ---- Model improved! Deploying new version..."
        else
          echo "deploy=false" >> $GITHUB_OUTPUT
          echo "2022BCS0016 ---- Metric did not improve. Skipping deployment."
        fi
    
    - name: Login to Docker Hub
      if: steps.compare.outputs.deploy == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build and Push Docker Image
      if: steps.compare.outputs.deploy == 'true'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/wine-quality:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/wine-quality:${{ github.run_number }}
    
    - name: Update Best R2 Score
      if: steps.compare.outputs.deploy == 'true'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh variable set BEST_R2_SCORE --body "${{ steps.current.outputs.current_r2 }}" --repo ${{ github.repository }} || echo "Variable update skipped"
        echo "BEST_R2_SCORE: ${{ steps.current.outputs.current_r2 }}"
    
    - name: Summary
      run: |
        echo "## Lab 4 Summary - 2022BCS0016" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Student:** Srinivas Raghav V C" >> $GITHUB_STEP_SUMMARY
        echo "**Roll No:** 2022BCS0016" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Training Metrics" >> $GITHUB_STEP_SUMMARY
        echo "- R2 Score: ${{ steps.current.outputs.current_r2 }}" >> $GITHUB_STEP_SUMMARY
        echo "- Previous Best: ${{ steps.best.outputs.best_r2 }}" >> $GITHUB_STEP_SUMMARY
        echo "- Deployed: ${{ steps.compare.outputs.deploy }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Docker Image" >> $GITHUB_STEP_SUMMARY
        echo "- Image: ${{ secrets.DOCKERHUB_USERNAME }}/wine-quality:latest" >> $GITHUB_STEP_SUMMARY
        echo "- Run Number: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY

name: Lab 4 Automated Model Deployment (CI/CD)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train:
    name: Continuous Integration (Train)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Training Script
        run: python train.py

      - name: Capture Metrics
        id: metrics
        run: |
          MSE=$(jq -r '.mse' metrics.json || echo "1.0")
          R2=$(jq -r '.r2' metrics.json || echo "0.0")
          echo "mse=$MSE" >> $GITHUB_OUTPUT
          echo "r2=$R2" >> $GITHUB_OUTPUT

      - name: Upload Model and Metrics
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            *.joblib
            metrics.json

  deploy:
    name: Continuous Deployment (Deploy)
    needs: train
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts

      - name: Check Metric Improvement
        id: check_metric
        run: |
          CURRENT_R2=$(jq -r '.r2' metrics.json)
          BEST_R2=${{ vars.BEST_R2_SCORE || '0.0' }}
          
          echo "Current R2: $CURRENT_R2"
          echo "Best R2: $BEST_R2"
          
          if (( $(echo "$CURRENT_R2 > $BEST_R2" | bc -l) )); then
            echo "improvement=true" >> $GITHUB_OUTPUT
            echo "New best model found!"
          else
            echo "improvement=false" >> $GITHUB_OUTPUT
            echo "2022BCS0016----Metric did not improve"
          fi

      - name: Log in to Docker Hub
        if: steps.check_metric.outputs.improvement == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: steps.check_metric.outputs.improvement == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/wine-quality-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/wine-quality-service:${{ github.sha }}

      - name: Update Best Metric Variable
        if: steps.check_metric.outputs.improvement == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_R2=$(jq -r '.r2' metrics.json)
          gh variable set BEST_R2_SCORE --body "$NEW_R2" || echo "Failed to update variable"

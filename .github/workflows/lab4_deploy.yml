name: Lab 4 Automated Model Deployment (CI/CD)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train:
    name: Continuous Integration (Train)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib

      - name: Run Training Script
        run: python train.py

      - name: Display Metrics
        run: |
          echo "=========================================="
          echo "Student: Srinivas Raghav V C"
          echo "Roll Number: 2022BCS0016"
          echo "=========================================="
          cat metrics.json
          echo "=========================================="

      - name: Upload Model and Metrics
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            model.joblib
            metrics.json

  deploy:
    name: Continuous Deployment (Deploy)
    needs: train
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts

      - name: Check Metric Improvement
        id: check_metric
        run: |
          CURRENT_R2=$(jq -r '.r2' metrics.json)
          BEST_R2="${{ vars.BEST_R2_SCORE }}"
          echo "=========================================="
          echo "Student: Srinivas Raghav V C (2022BCS0016)"
          echo "=========================================="
          echo "Current R2 Score: $CURRENT_R2"
          echo "Best R2 Score: ${BEST_R2:-0.0}"
          if (( $(echo "$CURRENT_R2 > ${BEST_R2:-0.0}" | bc -l) )); then
            echo "improvement=true" >> $GITHUB_OUTPUT
            echo "New best model found! R2: $CURRENT_R2"
          else
            echo "improvement=false" >> $GITHUB_OUTPUT
            echo "2022BCS0016----Metric did not improve"
          fi

      - name: Log in to Docker Hub
        if: steps.check_metric.outputs.improvement == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: steps.check_metric.outputs.improvement == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lab2-model:latest

      - name: Update Best R2 Score Variable
        if: steps.check_metric.outputs.improvement == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_R2=$(jq -r '.r2' metrics.json)
          gh variable set BEST_R2_SCORE --body "$NEW_R2"
          echo "Updated BEST_R2_SCORE to $NEW_R2"

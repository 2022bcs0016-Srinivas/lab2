name: Lab 4 Automated Model Deployment (CI/CD)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train:
    name: Continuous Integration (Train)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib

      - name: Run Training Script
        run: python train.py

      - name: Upload Model and Metrics
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            model.joblib
            metrics.json

  deploy:
    name: Continuous Deployment (Deploy)
    needs: train
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts

      - name: Check Metric Improvement
        id: check_metric
        run: |
          CURRENT_R2=$(jq -r '.r2' metrics.json)
          BEST_R2=${{ vars.BEST_R2_SCORE || '0.0' }}
          echo "Current R2: $CURRENT_R2"
          echo "Best R2: $BEST_R2"
          if (( $(echo "$CURRENT_R2 > $BEST_R2" | bc -l) )); then
            echo "improvement=true" >> $GITHUB_OUTPUT
            echo "New best model found!"
          else
            echo "improvement=false" >> $GITHUB_OUTPUT
            echo "2022BCS0016----Metric did not improve"
          fi

      - name: Log in to Docker Hub
        if: steps.check_metric.outputs.improvement == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        if: steps.check_metric.outputs.improvement == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/lab2-model:latest

      - name: Update Best R2 Score
        if: steps.check_metric.outputs.improvement == 'true'
        run: |
          NEW_R2=$(jq -r '.r2' metrics.json)
          curl -L \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/variables/BEST_R2_SCORE \
            -d '{"name":"BEST_R2_SCORE","value":"'"$NEW_R2"'"}'

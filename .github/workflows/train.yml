name: ML Training Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Train model
      id: train
      run: |
        python train.py > training_output.txt 2>&1
        cat training_output.txt

    - name: Extract metrics
      id: metrics
      run: |
        MSE=$(cat output/results.json | python -c "import sys, json; print(json.load(sys.stdin)['mse'])")
        R2=$(cat output/results.json | python -c "import sys, json; print(json.load(sys.stdin)['r2_score'])")
        echo "mse=$MSE" >> $GITHUB_OUTPUT
        echo "r2=$R2" >> $GITHUB_OUTPUT

    - name: Create Job Summary
      run: |
        echo "# ML Training Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Student:** Srinivas Raghav V C" >> $GITHUB_STEP_SUMMARY
        echo "**Roll Number:** 2022BCS0016" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Evaluation Metrics" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Mean Squared Error (MSE) | ${{ steps.metrics.outputs.mse }} |" >> $GITHUB_STEP_SUMMARY
        echo "| R² Score | ${{ steps.metrics.outputs.r2 }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Configuration" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Workflow Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

    - name: Upload trained model
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        path: output/model.pkl

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: results
        path: output/results.json
